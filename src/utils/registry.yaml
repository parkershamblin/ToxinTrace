##################
# MODEL REGISTRY #
##################

# Notes:
# Most scripts require a `model_name` argument, which refers to a model defined in the below list. 
# We provide all models used in our work, but it is simple to add more.
# Be sure to match each model with a corresponding tokenizer.

models:
  llama-3.2-1b:
    path: meta-llama/Llama-3.2-1B   # HuggingFace Hub path
    family: "llama-3"               # Model family; used by `utils/tasks.py` to set up influence function tracking
    tokenizer: pythia-tok           # Tokenizer used by this model; see below tokenizers
    block_size: 2048                # Block size (number of tokens) used to train the model
    pretrained: False               # Whether to load this model's pre-trained weights from the HuggingFace Hub
    num_layers: 16                  # Number of layers (Transformer blocks) in this model; used by `utils/tasks.py` to set up influence function tracking
    kwargs:                         # You can specify any other model kwargs supported by Transformers here
      torch_dtype: bfloat16         # Torch data type the model should be loaded in
    
  pythia-160m:
    path: EleutherAI/pythia-160m-deduped
    family: pythia
    tokenizer: pythia-tok
    block_size: 2048
    pretrained: False
    num_layers: 12
    kwargs:
      torch_dtype: bfloat16

  pythia-410m:
    path: EleutherAI/pythia-410m-deduped
    family: pythia
    tokenizer: pythia-tok
    block_size: 2048
    pretrained: False
    num_layers: 24
    kwargs:
      torch_dtype: bfloat16
  
  pythia-1b:
    path: EleutherAI/pythia-1b-deduped
    family: pythia
    tokenizer: pythia-tok
    block_size: 2048
    pretrained: False
    num_layers: 16
    kwargs:
      torch_dtype: bfloat16
    
  pythia-2.8b-pretrained:
    path: EleutherAI/pythia-2.8b-deduped
    family: pythia
    tokenizer: pythia-tok
    block_size: 2048
    pretrained: True
    kwargs:
      torch_dtype: bfloat16

  # ---------------- ToxinTrace additions ----------------
  # Tiny float32 models for CPU-only pipeline validation ("smoke" mode).
  pythia-14m-smoke:
    path: EleutherAI/pythia-14m
    family: pythia
    tokenizer: pythia-tok
    block_size: 2048
    pretrained: False
    num_layers: 6
    kwargs:
      torch_dtype: float32

  pythia-31m-smoke:
    path: EleutherAI/pythia-31m
    family: pythia
    tokenizer: pythia-tok
    block_size: 2048
    pretrained: False
    num_layers: 6
    kwargs:
      torch_dtype: float32

  llama-smoke:
    path: HuggingFaceTB/SmolLM2-135M  # architecture only (trained from scratch)
    family: "llama-3"
    tokenizer: pythia-tok
    block_size: 2048
    pretrained: False
    num_layers: 2
    config_overrides:
      num_hidden_layers: 2
      hidden_size: 128
      intermediate_size: 512
      num_attention_heads: 4
      num_key_value_heads: 2
      max_position_embeddings: 2048
      tie_word_embeddings: False
      bos_token_id: 0
      eos_token_id: 0
    kwargs:
      torch_dtype: float32

  # Non-Pythia target (~135M, Llama architecture, ungated) for the cross-family extension.
  smollm-135m:
    path: HuggingFaceTB/SmolLM2-135M  # architecture only (trained from scratch)
    family: "llama-3"
    tokenizer: pythia-tok
    block_size: 2048
    pretrained: False
    num_layers: 30
    config_overrides:
      max_position_embeddings: 2048
      bos_token_id: 0
      eos_token_id: 0
    kwargs:
      torch_dtype: bfloat16

  # ToxinTrace (E1): pre-trained GPT-2 small, fine-tuned on OpenWebText with a mask transferred from Pythia
  gpt2-pretrained:
    path: gpt2
    family: gpt2
    tokenizer: gpt2-tok
    block_size: 1024
    pretrained: True
    num_layers: 12
    kwargs:
      torch_dtype: bfloat16

  # ToxinTrace (E2): pre-trained Pythia-410M, fine-tuned on FineWeb 2025 without and with the E2 mask
  pythia-410m-pretrained:
    path: EleutherAI/pythia-410m-deduped
    family: pythia
    tokenizer: pythia-tok
    block_size: 2048
    pretrained: True
    num_layers: 24
    kwargs:
      torch_dtype: bfloat16

tokenizers:
  pythia-tok:
    path: EleutherAI/pythia-70m-deduped   # HuggingFace Hub path
    vocab_size: 50304                     # Vocab size of the tokenizer; used to potentially correct vocab sizes between models and tokenizers
  # ToxinTrace (E1)
  gpt2-tok:
    path: gpt2
    vocab_size: 50257
